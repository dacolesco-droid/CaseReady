<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseReady | Streamlined Legal Assistance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 1.5rem 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 1.75rem;
            color: #1e293b;
            font-weight: 700;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h2 {
            font-size: 2.5rem;
            line-height: 1.2;
            margin-bottom: 1rem;
            color: #0f172a;
        }

        .hero p {
            font-size: 1.125rem;
            color: #475569;
            margin-bottom: 2rem;
            max-width: 600px;
        }

        .cta-button {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 600;
            padding: 0.875rem 2rem;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .cta-button:hover {
            background-color: #1d4ed8;
        }

        footer {
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            padding: 1.5rem;
            font-size: 0.875rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <header>
        <h1>CaseReady</h1>
    </header>

    <main class="hero">
        <h2>Legal Preparation, Made Simple</h2>
        <p>Welcome to CaseReady. We are building a modern platform designed to help you organize documents, manage case details, and navigate legal processes with confidence.</p>
        <a href="mailto:support@mycaseready.com" class="cta-button">Get in Touch</a>
    </main>

    <footer>
        <p>&copy; 2026 CaseReady. All rights reserved.</p>
    </footer>

</body>
</html>
